<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <title>一起看 · aniGamerPlus+</title>
  <base href="/">
  <script>
    if (/(^|\.)discordsays\.com$/.test(location.hostname)) {
      document.querySelector('base').setAttribute('href', '/.proxy/');
    }
  </script>
  <link rel="icon" href="static/img/aniGamerPlus.ico">
  <link rel="stylesheet" href="static/css/agp.css?v=8">
  <link rel="stylesheet" href="static/css/discord-activity.css?v=6">
  <script defer src="static/js/vendor/discord-embedded-app-sdk.js"></script>
  <script defer src="static/js/discord-activity-presence.js?v=2"></script>
  <script defer src="static/js/discord-activity.js?v=8"></script>
</head>
<body class="agp-body activity-body">
  <header class="activity-topbar">
    <div class="activity-brand">
      <img src="static/img/aniGamerPlus.ico" width="22" height="22" alt="">
      <span>aniGamerPlus<b>+</b></span>
      <span class="activity-wordmark">一起看</span>
    </div>
    <div class="activity-topbar-actions">
      <span id="connectionStatus" class="activity-status" role="status">正在連線</span>
      <button id="activityPresenceToggle" class="activity-chip" type="button" aria-pressed="false" hidden>顯示播放動態</button>
      <button id="accountToggle" class="activity-chip activity-chip-account" type="button" aria-expanded="false" aria-controls="accountPanel">登入帳號</button>
    </div>
  </header>

  <main class="activity-main">
    <div class="activity-layout">
      <div class="activity-stage-column">
        <div id="activityNotice" class="activity-notice" role="status" hidden></div>
        <section class="activity-theater" aria-label="共同播放器">
          <div id="playerPlaceholder" class="activity-placeholder">
            <span class="activity-play-symbol" aria-hidden="true"></span>
            <h1 id="lobbyTitle">和朋友一起看動畫</h1>
            <p id="lobbyDescription">主控選片後，其他人同步觀看。</p>
            <div class="activity-placeholder-actions">
              <button id="activityLoginPrompt" class="activity-button activity-button-primary" type="button" hidden>登入網站帳號</button>
              <button id="connectButton" class="activity-button activity-button-primary" type="button" hidden>重新連線</button>
            </div>
          </div>
          <iframe id="activityPlayer" title="一起看播放器" allow="autoplay; picture-in-picture" hidden></iframe>
          <button id="activityExpandedExit" class="activity-button activity-expanded-exit" type="button" hidden>還原畫面 <span aria-hidden="true">Esc</span></button>
        </section>
        <div class="activity-now-playing">
          <div class="activity-now-title">
            <h2 id="playingTitle">尚未選片</h2>
            <p id="playingEpisode">等主控選一集，就可以開始了。</p>
          </div>
          <span id="playbackRole" class="activity-role" hidden></span>
        </div>
        <p id="controlDescription" class="activity-control-description">播放、暫停、快轉及倍速會同步；音量與字幕可各自調整。</p>
      </div>

      <aside class="activity-sidebar">
        <section class="activity-card activity-room" aria-labelledby="roomHeading">
          <div class="activity-card-heading">
            <h2 id="roomHeading">頻道成員 <span id="memberCount" class="activity-count">0</span></h2>
          </div>
          <div id="autoGrantControls" class="activity-auto-grant" hidden>
            <button id="autoGrantToggle" class="activity-switch" type="button" aria-pressed="false">自動授權訪客：關閉</button>
            <p>新加入的訪客與換片都自動取得該集授權。</p>
          </div>
          <ul id="memberList" class="activity-members"><li class="activity-empty">連線後會顯示參與者</li></ul>
        </section>
        <section class="activity-card activity-library" aria-labelledby="libraryHeading">
          <div class="activity-card-heading">
            <h2 id="libraryHeading">片庫</h2>
            <button id="refreshLibrary" class="activity-icon-button" type="button" aria-label="重新整理片庫" title="重新整理" disabled>↻</button>
          </div>
          <label class="agp-visually-hidden" for="librarySearch">搜尋片庫</label>
          <input id="librarySearch" class="activity-search" type="search" placeholder="搜尋作品或集數" autocomplete="off" disabled>
          <p id="libraryHint" class="activity-library-hint">加入活動後載入伺服器片庫。</p>
          <div id="libraryList" class="activity-library-list" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </main>

  <div id="accountPanel" class="activity-sheet" hidden>
    <section class="activity-sheet-card" role="dialog" aria-modal="true" aria-labelledby="accountHeading">
      <div class="activity-sheet-heading">
        <h2 id="accountHeading">網站帳號</h2>
        <button id="accountClose" class="activity-icon-button" type="button" aria-label="關閉帳號設定">✕</button>
      </div>
      <p id="accountDescription" class="activity-sheet-description"></p>
      <p id="accountIdentity" class="activity-account-identity" hidden></p>
      <form id="accountForm" class="activity-account-form" autocomplete="on">
        <div class="activity-field"><label for="accountUsername">帳號</label><input id="accountUsername" name="username" autocomplete="username" maxlength="128" required></div>
        <div class="activity-field"><label for="accountPassword">密碼</label><input id="accountPassword" name="password" type="password" autocomplete="current-password" maxlength="1024" required></div>
        <label class="activity-check"><input id="accountRemember" type="checkbox" checked> <span>綁定目前的 Discord 帳號，下次自動登入</span></label>
        <button id="accountLogin" class="activity-button activity-button-primary activity-button-block" type="submit">登入</button>
      </form>
      <div id="accountActions" class="activity-account-actions" hidden>
        <button id="accountLink" class="activity-button activity-button-primary" type="button">綁定此 Discord 帳號</button>
        <button id="accountUnlink" class="activity-button activity-button-danger" type="button" hidden>解除綁定</button>
        <button id="accountSwitch" class="activity-button" type="button">改用其他帳號</button>
      </div>
      <p id="accountFeedback" class="activity-form-feedback" role="status"></p>
    </section>
  </div>
  <div id="activityToast" class="activity-toast" role="status" hidden></div>
</body>
</html>
