<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="description" content="aniGamerPlus+ 本機動畫片庫，線上觀看、追番與下載管理。">
  <title>aniGamerPlus+</title>

  <link rel="shortcut icon" href="./static/img/aniGamerPlus.ico" type="image/x-icon">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./static/img/pwa/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="aniGamerPlus+">

  <link rel="stylesheet" href="./static/css/agp.css?v=4">
  <link rel="stylesheet" href="./static/css/home.css?v=2">
  <link rel="stylesheet" href="./static/css/catalog.css?v=5">

  <script id="agp-dashboard-bootstrap" type="application/json">{{ dashboard_bootstrap|tojson }}</script>
  <script src="./static/js/jquery-3.4.0.min.js"></script>
  <script src="./static/js/userapi.js?v=4"></script>
  <script src="./static/js/agp-shell.js?v=4"></script>
  <script src="./static/js/home.js?v=6"></script>
  <script src="./static/js/catalog.js?v=5"></script>
</head>

<body class="agp-body is-loading">
  <header class="agp-topbar">
    <div class="agp-shell agp-topbar-inner">
      <a class="agp-brand" href="./" aria-label="aniGamerPlus+ 首頁">
        <img src="./static/img/aniGamerPlus.ico" alt="">
        <span>aniGamerPlus</span>
        <b>+</b>
      </a>

      <form class="agp-search" role="search" autocomplete="off">
        <label class="agp-visually-hidden" for="homeSearch">搜尋作品</label>
        <input id="homeSearch" name="q" type="search" placeholder="搜尋動畫瘋作品…" enterkeyhint="search">
        <button type="submit" aria-label="搜尋">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </button>
      </form>

      <div class="agp-topbar-actions">
        <ul class="navbar-nav agp-usernav"></ul>
      </div>
    </div>
  </header>

  <nav class="agp-tabs" aria-label="頁面區塊">
    <div class="agp-shell agp-tabs-inner">
      <a class="agp-tab is-active" href="#top">首頁</a>
      <a class="agp-tab" href="#season">本季新番</a>
      <a class="agp-tab" href="#weekly">更新時間表</a>
      <a class="agp-tab" href="#library">片庫</a>
      <a class="agp-tab" href="#all">所有動畫</a>
    </div>
  </nav>

  <main class="agp-shell" id="top">
    <div class="agp-notice" id="homeNotice">
      <b>片庫</b>
      <span>正在載入片庫…</span>
    </div>

    <div id="homeBanner">
      <div class="agp-banner agp-skeleton" aria-hidden="true" style="min-height:190px"></div>
    </div>

    <div id="homeContinue"></div>
    <div id="homeSeason"></div>
    <div id="homeSchedule"></div>
    <div id="homeCatalogHot"></div>
    <div id="homeCatalogNew"></div>
    <div id="homeTimetable"></div>
    <div id="homeHot"></div>
    <div id="homeLibrary"></div>
    <div id="homeCatalog"></div>

    <footer class="agp-footer">
      aniGamerPlus+ · 本機片庫 · <a href="./control">主控台</a>
    </footer>
  </main>
</body>

</html>
