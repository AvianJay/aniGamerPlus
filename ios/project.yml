# Generates aniGamerPlus.xcodeproj. Checking in a .pbxproj means hand-merging a
# machine-written file on every change; this is the same project expressed in
# something a person can read, and `xcodegen generate` rebuilds it.
name: aniGamerPlus

options:
  bundleIdPrefix: sbs.avianjay
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    SWIFT_VERSION: "5.0"

targets:
  aniGamerPlus:
    type: application
    platform: iOS
    sources:
      - path: AGP
        excludes:
          - Info.plist
          - Resources
      # Bridge.js is read at runtime out of the bundle, so it has to be copied
      # rather than compiled.
      - path: AGP/Resources
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: AGP/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: sbs.avianjay.agpp
        PRODUCT_NAME: aniGamerPlus
        # iPhone and iPad: the owner watches on both.
        TARGETED_DEVICE_FAMILY: "1,2"
        # CI has no certificates and none are needed -- the IPA is sideloaded,
        # and the sideloader signs it with the installer's own identity.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

schemes:
  aniGamerPlus:
    build:
      targets:
        aniGamerPlus: all
    run:
      config: Debug
    archive:
      config: Release
