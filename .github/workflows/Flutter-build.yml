# Builds the Flutter client in flutter_app/ for Android and iOS.
#
# The platform shells (android/, ios/) are not in the repository: they are
# `flutter create` boilerplate that goes stale the moment Flutter moves on, so
# tool/prepare_platforms.sh regenerates and patches them on every run.
#
# The IPA comes out unsigned, same as the WebView shell in iOS-build.yml: an
# Apple Developer identity cannot live in a public repository, and every
# sideloader re-signs with the installer's own identity anyway. Android release
# builds use the repository's upload keystore; pull requests without access to
# repository secrets fall back to Flutter's debug key.
#
# Every push to master also refreshes the `nightly` prerelease (see the nightly
# job), which is what the app's built-in updater follows on its nightly channel.

name: aniGamerPlus Flutter App

on:
  push:
    branches:
      - master
    paths:
      - 'flutter_app/**'
      - '.github/workflows/Flutter-build.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/Flutter-build.yml'
  # Not a tag push: a path filter and a tag filter together make tag runs
  # unreliable, and by the time a release is published the release the build
  # attaches to definitely exists.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # No platform shell needed here: analysis only reads Dart.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Player regressions, offline watch times, the danmaku retry ledger, the
      # thumbnail cache and the episode picker. No device and no server needed:
      # the HTTP fakes are real HttpServers on loopback.
      - name: Unit and widget tests
        run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the platform shell
        run: bash tool/prepare_platforms.sh

      - name: Restore the Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_ALIAS}" || -z "${KEYSTORE_PASSWORD}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "Android signing secrets are unavailable; this pull request will use the debug key."
              exit 0
            fi
            echo "KEYSTORE_BASE64, KEYSTORE_ALIAS and KEYSTORE_PASSWORD are required." >&2
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks

      - name: Build the APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/release-keystore.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: Build the app bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/release-keystore.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build appbundle --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: Name the artifacts
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          APK="aniGamerPlus-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          AAB="aniGamerPlus-${VERSION}-${GITHUB_RUN_NUMBER}.aab"
          mv build/app/outputs/flutter-apk/app-release.apk "${APK}"
          mv build/app/outputs/bundle/release/app-release.aab "${AAB}"
          echo "APK_NAME=${APK}" >> "${GITHUB_ENV}"
          echo "AAB_NAME=${AAB}" >> "${GITHUB_ENV}"
          ls -lh "${APK}" "${AAB}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: flutter_app/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}
          path: flutter_app/${{ env.AAB_NAME }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: flutter_app/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    needs: analyze
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          flutter --version

      - name: Generate the platform shell
        run: bash tool/prepare_platforms.sh

      - name: Build
        run: |
          flutter build ios --release --no-codesign \
            --build-number "${GITHUB_RUN_NUMBER}"

      - name: Check the bundle
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "${APP}" || { echo "no app bundle at ${APP}"; exit 1; }
          lipo -info "${APP}/Runner"
          # The ATS exception is what lets the app talk to a LAN http:// server.
          # If the patch step silently stopped applying it, that would only show
          # up on a device, halfway through someone's evening.
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "${APP}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist"

      - name: Package the IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist")
          IPA="aniGamerPlus-flutter-${VERSION}-${GITHUB_RUN_NUMBER}-unsigned.ipa"
          rm -rf Payload
          mkdir Payload
          cp -R "${APP}" Payload/
          # An IPA is a zip whose single top-level directory is Payload.
          zip -qry "${IPA}" Payload
          rm -rf Payload
          echo "IPA_NAME=${IPA}" >> "${GITHUB_ENV}"
          ls -lh "${IPA}"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: flutter_app/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach the IPA to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: flutter_app/${{ env.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rolls the APK and IPA into the `nightly` prerelease under fixed names, next
  # to flutter-nightly.json, which the app's updater reads to learn the build
  # number. Only master: a pull request or a side branch must never reach the
  # phones that follow the nightly channel.
  nightly:
    needs: [android, ios]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Shared with Python-build.yml: both write to the same release.
    concurrency:
      group: nightly-release
      cancel-in-progress: false

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: aniGamerPlus-*
          path: dist
          merge-multiple: true

      - name: Rename and describe the build
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' flutter_app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          mv dist/aniGamerPlus-*-"${GITHUB_RUN_NUMBER}".apk dist/aniGamerPlus-nightly.apk
          mv dist/aniGamerPlus-flutter-*-"${GITHUB_RUN_NUMBER}"-unsigned.ipa dist/aniGamerPlus-nightly-unsigned.ipa
          APK=dist/aniGamerPlus-nightly.apk
          IPA=dist/aniGamerPlus-nightly-unsigned.ipa
          # The same run number is the app's build number, see --build-number.
          # Size and hash let the updater reject a download that was cut short:
          # the installer only reports that as a signature mismatch.
          jq -n \
            --arg version "${VERSION}" \
            --argjson build "${GITHUB_RUN_NUMBER}" \
            --arg commit "${GITHUB_SHA}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson apk_size "$(stat -c %s "${APK}")" \
            --arg apk_sha256 "$(sha256sum "${APK}" | cut -d' ' -f1)" \
            --argjson ipa_size "$(stat -c %s "${IPA}")" \
            --arg ipa_sha256 "$(sha256sum "${IPA}" | cut -d' ' -f1)" \
            '{version: $version, build: $build, commit: $commit, date: $date,
              apk: "aniGamerPlus-nightly.apk", apk_size: $apk_size, apk_sha256: $apk_sha256,
              ipa: "aniGamerPlus-nightly-unsigned.ipa", ipa_size: $ipa_size, ipa_sha256: $ipa_sha256}' \
            > dist/flutter-nightly.json
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          ls -lh dist

      - name: Publish to the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/publish-nightly.sh App "${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            dist/aniGamerPlus-nightly.apk \
            dist/aniGamerPlus-nightly-unsigned.ipa \
            dist/flutter-nightly.json
