# Builds the iOS shell that wraps the dashboard.
#
# The IPA comes out unsigned: signing needs an Apple Developer identity, which
# cannot live in a public repository, and every sideloader (AltStore, SideStore,
# Sideloadly, TrollStore) re-signs with the installer's own identity anyway. See
# ios/README.md for how to put it on a device.

name: aniGamerPlus iOS App

on:
  push:
    branches:
      - master
    paths:
      - 'ios/**'
      - '.github/workflows/iOS-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/iOS-build.yml'
  # Not a tag push: a path filter and a tag filter together make tag runs
  # unreliable, and by the time a release is published the release the IPA
  # attaches to definitely exists.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project aniGamerPlus.xcodeproj \
            -scheme aniGamerPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Check the bundle
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/aniGamerPlus.app"
          test -d "${APP}" || { echo "no app bundle at ${APP}"; exit 1; }
          # The bridge is read out of the bundle at runtime, so a copy phase
          # that quietly stopped including it would only show up on a device.
          test -f "${APP}/Bridge.js" || { echo "Bridge.js is missing from the bundle"; exit 1; }
          test -f "${APP}/AppIcon60x60@2x.png" || echo "note: no rendered app icon"
          lipo -info "${APP}/aniGamerPlus"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist"

      - name: Package the IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/aniGamerPlus.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist")
          IPA="aniGamerPlus-${VERSION}-${GITHUB_RUN_NUMBER}-unsigned.ipa"
          rm -rf Payload
          mkdir Payload
          cp -R "${APP}" Payload/
          # An IPA is a zip whose single top-level directory is Payload.
          zip -qry "${IPA}" Payload
          rm -rf Payload
          echo "IPA_PATH=ios/${IPA}" >> "${GITHUB_ENV}"
          echo "IPA_NAME=${IPA}" >> "${GITHUB_ENV}"
          ls -lh "${IPA}"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach the IPA to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.IPA_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
