# anigamerplus latest release build

name: aniGamerPlus Build Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v25.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: [3.11.x]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up release environment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="${{ inputs.version }}"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            RELEASE_FILENAME="aniGamerPlus_${RELEASE_VERSION}_windows_64bit.zip"
          else
            RELEASE_FILENAME="aniGamerPlus_${RELEASE_VERSION}_linux_64bit.zip"
          fi

          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_TITLE=aniGamerPlus_${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_FILENAME=${RELEASE_FILENAME}" >> "${GITHUB_ENV}"

      - name: Get tag message
        id: tag_data
        shell: bash
        run: |
          {
            echo 'git-tag-annotation<<EOF'
            git tag -l --format='%(contents)' "${RELEASE_VERSION}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --distpath %cd%\ --onefile --console --icon %cd%\Dashboard\static\img\aniGamerPlus.ico --clean --add-data "%cd%;aniGamerPlus/" %cd%\aniGamerPlus.py
        shell: cmd

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --distpath ./ --onefile --console --clean --add-data "./:aniGamerPlus/" aniGamerPlus.py

      - name: Archive release (Windows)
        if: runner.os == 'Windows'
        run: 7z a -tzip ${{ env.RELEASE_FILENAME }} aniGamerPlus.exe Dashboard DanmuTemplate.ass config-sample.json sn_list-sample.txt LICENSE README.md

      - name: Archive release (Linux)
        if: runner.os == 'Linux'
        run: 7z a -tzip ${{ env.RELEASE_FILENAME }} aniGamerPlus Dashboard DanmuTemplate.ass config-sample.json sn_list-sample.txt LICENSE README.md

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_TITLE }}
          body: ${{ steps.tag_data.outputs.git-tag-annotation }}
          draft: false
          prerelease: false
          files: ./${{ env.RELEASE_FILENAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
