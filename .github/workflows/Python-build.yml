name: aniGamerPlus Build Artifact

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # tests/ was never run by CI, so it rotted: a whole block still pointed at an
  # ios/ directory deleted months earlier, and nobody saw the 1 failed +
  # 3 errors. Run it.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      # The HLS fixtures are built with ffmpeg; without it they skip instead of
      # covering the /stream/* routes.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          PYTHONIOENCODING: utf-8

  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: [3.11.x]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --distpath %cd%\ --onefile --console --icon %cd%\Dashboard\static\img\aniGamerPlus.ico --clean --add-data "%cd%;aniGamerPlus/" %cd%\aniGamerPlus.py
        shell: cmd

      - name: Build Executable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --distpath ./ --onefile --console --clean --add-data "./:aniGamerPlus/" aniGamerPlus.py

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aniGamerPlus_artifacts_windows_${{ matrix.python }}
          path: |
            aniGamerPlus.exe
            Dashboard/
            LICENSE
            README.md
            DanmuTemplate.ass
            sn_list-sample.txt
            config-sample.json

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: aniGamerPlus_artifacts_linux_${{ matrix.python }}
          path: |
            aniGamerPlus
            Dashboard/
            LICENSE
            README.md
            DanmuTemplate.ass
            sn_list-sample.txt
            config-sample.json
