name: file_export
description: 把 App 沙盒裡的檔案存到使用者自己選的位置 (Android 儲存空間存取架構 / iOS 檔案 App).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: tw.avianjay.file_export
        pluginClass: FileExportPlugin
      ios:
        pluginClass: FileExportPlugin
