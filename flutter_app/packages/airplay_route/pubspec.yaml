name: airplay_route
description: iOS 的 AirPlay 按鈕 (AVRoutePickerView) 跟「現在是不是在 AirPlay 上」.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AirplayRoutePlugin
